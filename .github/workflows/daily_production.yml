name: Autonomous B2B Production

on:
  schedule:
    - cron: '0 6 * * *'
  repository_dispatch:
    types: [telegram_approve]
  workflow_dispatch:

env:
  SANDBOX_MODE: ${{ secrets.SANDBOX_MODE || 'true' }}
  FINANCIAL_MODE: ${{ secrets.FINANCIAL_MODE }}
  MIN_EDITORIAL_SCORE_THRESHOLD: ${{ secrets.MIN_EDITORIAL_SCORE_THRESHOLD }}
  MAX_DAILY_NET_COMPUTE_LIMIT_EUR: ${{ secrets.MAX_DAILY_NET_COMPUTE_LIMIT_EUR }}
  NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PLUNK_PUBLIC_API_KEY: ${{ secrets.PLUNK_PUBLIC_API_KEY }}
  PLUNK_SECRET_API_KEY: ${{ secrets.PLUNK_SECRET_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PAVED_API_KEY: ${{ secrets.PAVED_API_KEY }}
  LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
  LEMON_SQUEEZY_SHOP_ID: ${{ secrets.LEMON_SQUEEZY_SHOP_ID }}
  PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_SECRET_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

jobs:
  morning_dispatch:
    name: Morning Signal Ingestion & Dry Run Sandbox Preview
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SANDBOX_MODE: 'true'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Sensor Engine (Signal Ingestion)
        run: node 01_Research/sensor_engine.mjs

      - name: Run Editorial Engine (Script Generation)
        run: node 03_Scripts/editorial_engine.mjs

      - name: Run Distribution Engine (Sandbox Preview & Telegram Dispatch)
        run: node 07_Published/distribution_engine.mjs

  production_run:
    name: Full Autonomous Live Production Run
    if: github.event_name == 'repository_dispatch' && github.event.action == 'telegram_approve'
    runs-on: ubuntu-latest
    env:
      SANDBOX_MODE: 'false'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Asset Factory (Voice & Graphics Blueprinting)
        run: node 03_Scripts/asset_factory.mjs

      - name: Run Live Distribution Engine
        run: node 07_Published/distribution_engine.mjs

      - name: Run Monetization Engine (Affiliate & Sponsor Linking)
        run: node 10_Products/monetization_engine.mjs

      - name: Send Completion Notification to Telegram
        if: success()
        run: |
          MESSAGE="🚀 *Future Desk OS Production Run Complete!*%0A%0AAssets generated, live distribution executed, and monetization report updated."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN || '8707626369:AAFRdo6pNaFl-fcgavVTt97Yzbfm2UiPrFo' }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID || '846896390' }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
